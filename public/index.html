    html,
    body,
    #app {
      height: fit-content;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      background: #000;
      font-family: 'Roboto', sans-serif;
      color: #fff;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
    }

    #loader-wrapper .window {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-right: -50%;
      transform: translate(-50%, -50%)
    }

    #loader-wrapper .container {
      width: 150px;
      height: 10px;
      border: 2px solid #b2b2b2;
      border-radius: 7px;
      margin: 0 auto;
      padding: 2px 1px;
      overflow: hidden;
      font-size: 0;
    }

    #loader-wrapper .box {
      width: 9px;
      height: 100%;
      background: linear-gradient(to bottom, #2838c7 0%, #5979ef 17%, #869ef3 32%, #869ef3 45%, #5979ef 59%, #2838c7 100%);
      display: inline-block;
      margin-right: 2px;
      animation: loader 2s infinite;
      animation-timing-function: linear;
    }

    #loader-wrapper .logo {
      width: 220px;
      margin: 50px auto;
    }

    #loader-wrapper .logo p {
      margin: 0;
      padding: 0;
    }

    #loader-wrapper .top {
      font-size: 16px;
      font-weight: 300;
      line-height: 16px;
    }

    #loader-wrapper .top:after {
      content: "\00a9";
      font-size: 10px;
      position: relative;
      top: -5px;
      margin-left: 2px;
    }

    #loader-wrapper .mid {
      font-size: 46px;
      font-weight: 700;
      line-height: 36px;
    }

    #loader-wrapper .mid span {
      font-size: 22px;
      display: inline-block;
      vertical-align: top;
      color: #FF6821;
      margin-top: -8px;
    }

    #loader-wrapper .logo .bottom {
      font-size: 30px;
      font-weight: 300;
      line-height: 30px;
      margin-left: 5px;

    }

    @keyframes loader {
      0% {
        transform: translate(-30px);
      }

      100% {
        transform: translate(150px);
      }
    }
